function chooseLanguage(){
 const saved=localStorage.getItem("dextorPrivacyLang");
 if(saved && policies[saved]) return saved;
 const langs=(navigator.languages||[navigator.language||"en"]).map(x=>x.toLowerCase().split("-")[0]);
 return langs.find(x=>policies[x]) || "en";
}
function render(lang){
 const p=policies[lang]||policies.en;
 document.documentElement.lang=lang;
 document.title=`Dextor — ${p.title}`;
 document.getElementById("tagline").textContent=p.tag;
 document.getElementById("policy").innerHTML=`<h1>${p.title}</h1><div class="updated">${p.updated}</div>`+
   p.sections.map(s=>`<section><h2>${s[0]}</h2><p>${s[1]}</p></section>`).join("");
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
 localStorage.setItem("dextorPrivacyLang",lang);
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.lang)));
render(chooseLanguage());
</script>
