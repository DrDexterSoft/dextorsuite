    const piezas = s[1].split(/(@MOCK1@|@MOCK2@|@MOCK3@)/);
    const cuerpo = piezas
      .map((p) => {
        if (p === '@MOCK1@') return mockupInicial(t);
        if (p === '@MOCK2@') return mockupExpandido(t);
        if (p === '@MOCK3@') return mockupUac(t);
        if (p.trim() === '') return '';
        return `<p>${p}</p>`;
      })
      .join('');
    return `<div class="step">
      <div class="step-num">${i + 1}</div>
      <div class="step-body"><h2>${s[0]}</h2>${cuerpo}</div>
    </div>`;
  }).join('');
  document.getElementById("policy").innerHTML = `
    <h1>${t.title}</h1>
    <div class="updated">${t.updated}</div>
    <div class="guide-image">
      <h2 style="font-size:22px;margin:0 0 12px">${t.guideTitle}</h2>
      <img src="assets/windows-install-guide.png" alt="${t.guideTitle}" loading="eager">
      <div class="guide-caption">${t.guideCaption}</div>
    </div>
    ${stepsHtml}
    <div class="notice"><strong>${t.whyTitle}</strong><br>${t.whyBody}</div>
    <div class="step" style="margin-top:40px">
      <div class="step-body"><p>${t.contactBody}</p></div>
    </div>
  `;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  localStorage.setItem("dextorInstallLang", lang);
}
function chooseLanguage(){
  const saved = localStorage.getItem("dextorInstallLang");
  if (saved && data[saved]) return saved;
  const langs = (navigator.languages || [navigator.language || "en"]).map(x => x.toLowerCase().split("-")[0]);
  return langs.find(x => data[x]) || "en";
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));
render(chooseLanguage());
</script>
